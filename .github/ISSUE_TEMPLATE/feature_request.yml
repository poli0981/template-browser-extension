name: ✨ Feature request
description: Propose a new capability for the template.
title: "[feat]: "
labels: ["enhancement", "triage"]
assignees:
  - poli0981

body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature! For larger ideas, consider opening
        a [Discussion](https://github.com/poli0981/template-browser-extension/discussions/categories/ideas)
        first to validate scope before filing this issue.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Pre-checks
      options:
        - label: I searched [existing issues](https://github.com/poli0981/template-browser-extension/issues?q=is%3Aissue) and Discussions; this is not a duplicate.
          required: true
        - label: This fits the template's scope (cross-browser Chromium MV3 extension scaffold).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user pain or workflow gap. Avoid jumping to a specific solution here.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should this work from a user's perspective?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why you prefer the proposed one.

  - type: dropdown
    id: scope
    attributes:
      label: Where does this live?
      multiple: true
      options:
        - Template source code (src/, manifest, build)
        - Workflows (.github/workflows/)
        - Documentation
        - Issue / PR templates
        - Tooling (ESLint, Prettier, commitlint, Husky)
        - Other
    validations:
      required: true

  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking change?
      options:
        - label: This would be a breaking change for downstream consumers of the template.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links to similar features in other tools, mockups, etc.

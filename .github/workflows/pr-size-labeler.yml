name: PR Size Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/xs"
          xs_max_size: "10"
          s_label: "size/s"
          s_max_size: "100"
          m_label: "size/m"
          m_max_size: "500"
          l_label: "size/l"
          l_max_size: "1000"
          xl_label: "size/xl"
          fail_if_xl: "false"
          message_if_xl: |
            This PR exceeds 1000 line changes. Consider splitting it into smaller
            focused PRs for easier review. Reviewers may ask for a split.
          files_to_ignore: |
            pnpm-lock.yaml
            package-lock.json
            yarn.lock
            public/_locales/**
            public/icons/**
            "*.snap"

name: Notify CI Failures

# IMPORTANT: workflow_run does NOT accept wildcard workflow names. The previous
# version (`workflows: ["*"]`) caused every run to be skipped silently because
# the trigger never matched. List concrete workflow names here.
on:
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - "Dependency Review"
      - "Repo Lint"
      - "Validate manifest"
      - "Lockfile check"
      - "PR Labeler"
      - "PR Size Labeler"
      - release-please
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    # Only notify on failure or timeout — success runs would be noise.
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    uses: poli0981/.github/.github/workflows/notify-ci-failure.yml@main
    secrets: inherit

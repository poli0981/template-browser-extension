name: Stale issues & PRs

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,roadmap,help wanted,good first issue"
          exempt-pr-labels: "pinned,security,dependencies,blocked"
          stale-issue-message: |
            This issue has been automatically marked **stale** because it has not
            had recent activity. It will be closed in 14 days if no further activity
            occurs. Comment to keep it open, or close it if no longer relevant.
          stale-pr-message: |
            This pull request has been automatically marked **stale** because it
            has not had recent activity. It will be closed in 14 days if no further
            activity occurs. Push a commit or comment to keep it open.
          close-issue-message: |
            Closing as stale. Comment to reopen if this is still relevant.
          close-pr-message: |
            Closing as stale. Feel free to reopen if you'd like to continue.
          operations-per-run: 60

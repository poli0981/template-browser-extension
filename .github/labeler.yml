# Path-based PR labels, consumed by actions/labeler@v5

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "README.md"
          - "**/*.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/dependabot.yml"

github-templates:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/ISSUE_TEMPLATE/**"
          - ".github/DISCUSSION_TEMPLATE/**"
          - ".github/PULL_REQUEST_TEMPLATE.md"
          - ".github/CODEOWNERS"
          - ".github/FUNDING.yml"

source:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "public/**"

build-config:
  - changed-files:
      - any-glob-to-any-file:
          - "vite.config.ts"
          - "tsconfig.json"
          - "package.json"
          - "manifest.json"
          - "eslint.config.js"
          - ".prettierrc"
          - ".editorconfig"

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - ".husky/**"
          - "commitlint.config.js"
          - ".lintstagedrc.json"
          - ".devcontainer/**"

legal:
  - changed-files:
      - any-glob-to-any-file:
          - "legal/**"
          - "LICENSE"
          - "DISCLAIMER.md"
          - "SECURITY.md"
          - "CODE_OF_CONDUCT.md"

i18n:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/i18n/**"
          - "public/_locales/**"
